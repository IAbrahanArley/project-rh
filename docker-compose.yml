services:
  postgres:
    image: postgres:16-alpine
    container_name: rh-postgres
    environment:
      POSTGRES_DB: rh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rh"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rh
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:5173
      JWT_SECRET: change-this-development-secret-with-at-least-32-chars
      JWT_EXPIRATION_MINUTES: 120
      RESUME_BUCKET: ${RESUME_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RESUME_MAX_SIZE_BYTES: ${RESUME_MAX_SIZE_BYTES:-10485760}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rh-frontend
    depends_on:
      - api
    environment:
      FRONTEND_API_BASE_URL: http://localhost:8080
    ports:
      - "4200:80"

volumes:
  rh-postgres-data:
