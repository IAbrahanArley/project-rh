server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /assets/runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|map|json|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
