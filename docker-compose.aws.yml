services:
  postgres:
    image: postgres:16-alpine
    container_name: rh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rh}
      POSTGRES_USER: ${POSTGRES_USER:-rh_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - rh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_app} -d ${POSTGRES_DB:-rh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rh}
      DB_USERNAME: ${POSTGRES_USER:-rh_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      RESUME_BUCKET: ${RESUME_BUCKET:?RESUME_BUCKET is required}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RESUME_KEY_PREFIX: ${RESUME_KEY_PREFIX:-resumes}
      RESUME_MAX_SIZE_BYTES: ${RESUME_MAX_SIZE_BYTES:-10485760}
      RESUME_UPLOAD_URL_EXPIRATION_SECONDS: ${RESUME_UPLOAD_URL_EXPIRATION_SECONDS:-300}
      RESUME_DOWNLOAD_URL_EXPIRATION_SECONDS: ${RESUME_DOWNLOAD_URL_EXPIRATION_SECONDS:-300}
    expose:
      - "8080"

  proxy:
    image: nginx:1.27-alpine
    container_name: rh-api-proxy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./ops/ec2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist/rh-frontend/browser:/usr/share/nginx/html:ro

volumes:
  rh-postgres-data:
