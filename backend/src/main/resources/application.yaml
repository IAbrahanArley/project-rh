spring:
  application:
    name: rh
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rh}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
