spring:
  application:
    name: rh
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rh}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  storage:
    resumes:
      bucket: ${RESUME_BUCKET:}
      region: ${AWS_REGION:us-east-1}
      key-prefix: ${RESUME_KEY_PREFIX:resumes}
      max-size-bytes: ${RESUME_MAX_SIZE_BYTES:10485760}
      upload-url-expiration-seconds: ${RESUME_UPLOAD_URL_EXPIRATION_SECONDS:300}
      download-url-expiration-seconds: ${RESUME_DOWNLOAD_URL_EXPIRATION_SECONDS:300}
